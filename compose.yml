services:
  project-db:
    image: pgvector/pgvector:pg17
    container_name: razorpay-buildathon-project-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PROJECT_DB_NAME:-razorpay_project}
      POSTGRES_USER: ${PROJECT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PROJECT_DB_PASSWORD:-postgres}
    ports:
      - "5443:5432"
    volumes:
      - project_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-db:
    image: pgvector/pgvector:pg17
    container_name: razorpay-buildathon-agent-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AGENT_DB_NAME:-razorpay_agent_memory}
      POSTGRES_USER: ${AGENT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:-postgres}
    ports:
      - "5445:5432"
    volumes:
      - agent_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  agent_db_data:
  project_db_data:
